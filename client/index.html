<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- SEO -->
    <meta
      name="description"
      content="EVERHOME DREAMS LTD task management system to manage tasks, track progress, and organize priorities."
    />
    <meta
      name="keywords"
      content="EVERHOME DREAMS LTD, task management, todo app, productivity app, task tracker"
    />
    <meta name="robots" content="index, follow" />
    <meta name="application-name" content="EVERHOME DREAMS LTD" />
    <meta name="theme-color" content="#005bf6" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EVERHOME DREAMS LTD" />
    <meta property="og:title" content="EVERHOME DREAMS LTD – Task Management" />
    <meta property="og:description" content="Manage tasks efficiently with EVERHOME DREAMS LTD. Track progress, priorities, and deadlines." />
    <meta property="og:image" content="/icons/icon-512x512.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EVERHOME DREAMS LTD – Task Manager" />
    <meta name="twitter:description" content="Organize, prioritize, and complete tasks efficiently using EVERHOME DREAMS LTD." />
    <meta name="twitter:image" content="/icons/icon-512x512.png" />

    <!-- ============================================================ -->
    <!--  PWA — Web App Manifest (Android / Chrome / Samsung)         -->
    <!-- ============================================================ -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ============================================================ -->
    <!--  PWA — iOS / Safari                                          -->
    <!-- ============================================================ -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent = full-bleed under notch; use default for white status bar -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Short name shown under the icon on iPhone Home Screen -->
    <meta name="apple-mobile-web-app-title" content="EverHome" />

    <!-- Apple Touch Icons (used by iOS when adding to Home Screen) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144x144.png" />
    <link rel="apple-touch-icon" sizes="128x128" href="/icons/icon-128x128.png" />
    <link rel="apple-touch-icon" sizes="96x96"   href="/icons/icon-96x96.png" />
    <link rel="apple-touch-icon" sizes="72x72"   href="/icons/icon-72x72.png" />

    <!-- iOS Splash Screens (portrait orientations) -->
    <!-- iPhone SE (1st/2nd gen) -->
    <link rel="apple-touch-startup-image"
      media="(device-width:320px) and (device-height:568px) and (-webkit-device-pixel-ratio:2)"
      href="/icons/icon-512x512.png" />
    <!-- iPhone 8 / SE 3 -->
    <link rel="apple-touch-startup-image"
      media="(device-width:375px) and (device-height:667px) and (-webkit-device-pixel-ratio:2)"
      href="/icons/icon-512x512.png" />
    <!-- iPhone X / XS / 11 Pro -->
    <link rel="apple-touch-startup-image"
      media="(device-width:375px) and (device-height:812px) and (-webkit-device-pixel-ratio:3)"
      href="/icons/icon-512x512.png" />
    <!-- iPhone 12 / 13 / 14 -->
    <link rel="apple-touch-startup-image"
      media="(device-width:390px) and (device-height:844px) and (-webkit-device-pixel-ratio:3)"
      href="/icons/icon-512x512.png" />
    <!-- iPhone 14 Pro / 15 / 15 Pro -->
    <link rel="apple-touch-startup-image"
      media="(device-width:393px) and (device-height:852px) and (-webkit-device-pixel-ratio:3)"
      href="/icons/icon-512x512.png" />
    <!-- iPhone 15 Plus / 15 Pro Max -->
    <link rel="apple-touch-startup-image"
      media="(device-width:430px) and (device-height:932px) and (-webkit-device-pixel-ratio:3)"
      href="/icons/icon-512x512.png" />

    <!-- ============================================================ -->
    <!--  Windows Tiles (Edge / Windows)                              -->
    <!-- ============================================================ -->
    <meta name="msapplication-TileColor" content="#005bf6" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />
    <meta name="msapplication-config" content="none" />

    <title>EVERHOME DREAMS LTD | Task Management</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
