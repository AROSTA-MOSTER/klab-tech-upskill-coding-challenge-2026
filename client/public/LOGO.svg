<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Blue background -->
  <rect width="500" height="500" rx="40" fill="#005bf6" />
  
  <!-- White Monogram & House Structure -->
  <g fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="miter">
    <!-- Center Vertical Line -->
    <line x1="185" y1="50" x2="185" y2="390" />
    
    <!-- Left 'e' Loop -->
    <path d="M 185 285 L 105 285 C 75 285 68 335 100 365 C 130 390 170 390 170 390" />
    
    <!-- Roof Pitch: starts from vertical line at (185, 260), peaks at (260, 180), slopes down to (430, 350) -->
    <polyline points="185,260 260,180 430,350" />
    
    <!-- Right leg / wall: vertical line down to baseline -->
    <line x1="335" y1="265" x2="335" y2="390" />
  </g>
</svg>
